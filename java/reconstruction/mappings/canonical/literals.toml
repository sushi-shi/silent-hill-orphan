]

[[rules]]
id = "engine_rendering_layout"
domain = "engine_layout_and_rendering"
sources = ["InkEngine.java"]
members = [
    "menuPaintIngame", "menuPaintIngameImageBorders", "inventoryMenuPaint",
    "menuPaintEngine", "menuPaintLoadingBar", "menuPaintCurrentEngine",
    "menuCreateHeaderFooterImages", "menuEngineDrawScrollBar", "appPaint",
