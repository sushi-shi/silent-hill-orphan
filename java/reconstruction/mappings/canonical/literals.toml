]
meaning = "Reusable menu IDs, choice route codes, text-table indices, resource slots, and initial cursor/layout values."
evidence = [
    "Each number is stored beside a named MenuModel ID, choice command, or setup resource",
    "Text IDs resolve through the recovered language pack",
    "The source-backup oracle contains the same engine menu construction methods",
]

[[rules]]
id = "engine_menu_update"
domain = "menu_state_and_animation"
sources = ["InkEngine.java"]
members = ["menuUpdateIngame", "logoHandling"]
meaning = "Menu row animation phases, cursor timing, menu close states, and logo/splash progression thresholds."
