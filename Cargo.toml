[workspace]
resolver = "2"
members = [
    "crates/orphan-content",
    "crates/orphan-formats",
    "transliteration/crates/orphan-game-xlat",
    "transliteration/crates/orphan-jvm",
    "transliteration/crates/orphan-me",
    "transliteration/tools/orphan-ast-audit",
    "transliteration/tools/orphan-pure-oracle",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"

[workspace.dependencies]
j2me-canvas = { git = "https://github.com/sushi-shi/j2me-preservation-kit.git", rev = "7aeba277a270eb58658d211bd3621b30956f6212" }
j2me-jvm = { git = "https://github.com/sushi-shi/j2me-preservation-kit.git", rev = "7aeba277a270eb58658d211bd3621b30956f6212" }
quote = "1"
syn = { version = "3", features = ["full", "visit"] }

[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
